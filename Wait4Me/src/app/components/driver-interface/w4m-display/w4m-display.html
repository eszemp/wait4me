<div class="w4m-display-shell">
    @if(this.state!='open') {
        <div class="request none">
            <span>{{this.state}}</span>
        </div>
    }
    @else {
        <div class="request open" (click)="this.process_requests_for_this_stop()">
            <span>+ {{this.currentlyRequestedDelay}} min ?</span>
        </div>
    }
</div>
