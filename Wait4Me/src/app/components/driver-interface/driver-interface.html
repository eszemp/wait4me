<app-driver-status
  [currentTime]="currentTime()"
  [actualPosition]="actualPosition()"
  [stationQuery]="stationQuery()"
  [showSuggestions]="showSuggestions()"
  [stationSuggestions]="stationSuggestions()"
  [isResolvingPosition]="isResolvingPosition()"
  [positionError]="positionError()"
  [selectedDate]="selectedDate()"
  [selectedTime]="selectedTime()"
  (stationQueryChange)="onStationQueryChange($event)"
  (stationInputFocus)="onStationInputFocus()"
  (stationInputBlur)="closeSuggestions()"
  (stationSelected)="selectSuggestedStation($event)"
  (ownPositionClicked)="onOwnPositionClick()"
  (selectedDateChange)="onSelectedDateChange($event)"
  (selectedTimeChange)="onSelectedTimeChange($event)"
/>

<app-driver-departures
  [actualPosition]="selectedOriginName() || actualPosition()"
  [departureLines]="departureLines()"
  [isLoadingDepartures]="isLoadingDepartures()"
  [hasSelectedOrigin]="selectedOriginName().trim().length > 0"
  [loadError]="loadError()"
  (departureSelected)="openConnectionDetails($event)"
/>

@if (departureLines().length === 0) {
  <section class="info-section">
    <img class="info-icon" src="/circle-information-extra-small.svg" alt="" aria-hidden="true" />

    <p class="info-text">
      Use your position or search for a station, then select your course from the list of departures. After that the route will be displayed. Incoming Wait4Me requests will be shown and a response can be selected.
    </p>
  </section>
}
