<div class="status-row">
  <section class="input-section" id="driver-id">
    Line and course number
  </section>

  <section class="input-section" id="time">
    {{ currentTime() | date: 'HH:mm:ss' }}
  </section>
</div>


<section class="info-section">
    <img class="info-icon" src="/circle-information-extra-small.svg" alt="" aria-hidden="true" />

    <p class="info-text">
        Enter the Line number and Course number. After that the route will be displayed. If a Wait4Me request is received, it will be indicated and the response can be selected.
</section>
