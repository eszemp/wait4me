<div class="monitoring-shell">
  <div class="map-stage">
    <div class="map-toolbar">
      <label class="layer-label" for="monitoring-layer-select">Layer</label>
      <select id="monitoring-layer-select" class="layer-select" [(ngModel)]="selectedLayerId">
        @for (layer of layerOptions; track layer.id) {
          <option [value]="layer.id">{{ layer.label }}</option>
        }
      </select>
    </div>

    @switch (selectedLayerId) {
      @case ('station-statistics') {
        <app-station-statistics-layer />
      }
      @case ('delay-effects-on-lines') {
        <app-delay-effects-on-lines-layer
          [initialStopName]="stopName"
          [initialDepartureTime]="depTime"
          [delay]="delay"
        />
      }
    }
  </div>
</div>
