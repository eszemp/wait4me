<form class="route-card" [formGroup]="tripForm()" novalidate>
  <app-destination-autocomplete
    [inputId]="'from'"
    placeholder="From"
    [control]="tripForm().controls.from"
  />

  <app-destination-autocomplete
    [inputId]="'to'"
    placeholder="To"
    [control]="tripForm().controls.to"
  />

  <div class="meta-row">
    <input id="date" type="date" class="pill-input" formControlName="date" (change)="onDateTimeChanged()"/>
    <input id="time" type="time" class="pill-input" formControlName="time" (change)="onDateTimeChanged()"/>
  </div>
</form>
