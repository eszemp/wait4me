<main class="app-shell">
	<header class="top-bar">Wait4Me</header>

	<app-route-form [tripForm]="tripForm" [destinations]="destinations" />

	<section class="info-section">
		<img class="info-icon" src="/circle-information-extra-small.svg" alt="" aria-hidden="true" />

		<p class="info-text">
			To use Wait4Me, search for your route and select your connection. If there is a delay and
			you might not be able to make the transfer, you can send a request for the driver of the
			second vehicle to Wait4You by clicking the button below. 
      <a href="#" class="impressum-link">Impressum</a>
		</p>

	</section>

	<button type="button" class="w4m-button">Wait4Me</button>
</main>
