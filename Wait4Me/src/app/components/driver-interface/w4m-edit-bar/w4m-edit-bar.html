<div class="edit-bar">
    @if (this.w4mService.editMode()) {
        <button type="button" class="accept" (click)="this.w4mService.accept_request()">
            Accept
        </button>
        <button type="button" class="decline" (click)="this.w4mService.decline_request()">
            Decline
        </button>
        <div class="total_requests">{{this.w4mService.activeRequestIds()[this.w4mService.smallestRequestedDelay()].length}}x requested</div>
    }
</div>
