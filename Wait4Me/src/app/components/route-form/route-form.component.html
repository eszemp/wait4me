<form class="route-card" [formGroup]="tripForm()" novalidate>
  <app-destination-autocomplete
    [inputId]="'from'"
    placeholder="From"
    [control]="tripForm().controls.from"
    [destinations]="destinations()"
  />

  <app-destination-autocomplete
    [inputId]="'to'"
    placeholder="To"
    [control]="tripForm().controls.to"
    [destinations]="destinations()"
  />

  <div class="meta-row">
    <input id="date" type="date" class="pill-input" formControlName="date" />
    <input id="time" type="time" class="pill-input" formControlName="time" />
  </div>
</form>
