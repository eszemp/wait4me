<div class="edit-bar">
    @if (this.w4mService.editMode() && !this.w4mService.hideEditMode()) {
        <div class="edit-actions">
            <button type="button" class="accept" (click)="this.w4mService.accept_request()">
                Wait
            </button>
            <button type="button" class="decline" (click)="this.w4mService.decline_request()">
                Do not wait
            </button>
        </div>
        <div class="total-requests">{{this.w4mService.activeRequestIds()[this.w4mService.smallestRequestedDelays()[this.w4mService.activeStopRef()!]].length}}x requested</div>
    }
</div>
